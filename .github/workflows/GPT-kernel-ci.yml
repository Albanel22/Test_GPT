name: GPT-Kernel CI - Motorola One 5G Ace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            curl \
            zip \
            unzip \
            python3 \
            clang \
            llvm \
            lld \
            ccache \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            patch

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: kernel-ccache-${{ runner.os }}
          restore-keys: |
            kernel-ccache-

      - name: Prepare scripts
        run: |
          chmod +x build/*.sh

      - name: Show project tree
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

      - name: Run Copilote Build System
        run: |
          ./build/run.sh

      - name: Upload kernel source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Source
          path: |
            kernel_src/fs/open.c
            kernel_src/fs/proc/task_mmu.c

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build
          path: |
            ReSukiSU-AnyKernel3-kiev.zip
            kernel_src/build.log
            kernel_src/out/**/*

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Debug
          path: |
            debug/**
