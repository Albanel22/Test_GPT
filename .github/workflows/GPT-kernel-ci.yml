name: Test-GPT Kernel Builder

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVICE: kiev

jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 180

    steps:

    ########################################################
    # Checkout
    ########################################################

    - name: Checkout repository
      uses: actions/checkout@v4

    ########################################################
    # Dependencies
    ########################################################

    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            gcc \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            pahole \
            python3 \
            unzip \
            wget \
            zip

    ########################################################
    # Permissions
    ########################################################

    - name: Make scripts executable
      run: |

        chmod +x build/*.sh

    ########################################################
    # STEP 00
    ########################################################

    - name: Prepare Environment
      run: ./build/00_prepare.sh

    ########################################################
    # STEP 01
    ########################################################

    - name: Clone Kernel
      run: ./build/01_clone_kernel.sh

    ########################################################
    # STEP 02
    ########################################################

    - name: Integrate ReSuKiSU
      run: ./build/02_integrate_resukisu.sh

    ########################################################
    # STEP 03
    ########################################################

    - name: Integrate SuSFS
      run: ./build/03_integrate_susfs.sh

    ########################################################
    # STEP 04
    ########################################################

    - name: Apply Motorola patches
      run: ./build/04_apply_device_patches.sh

    ########################################################
    # STEP 05
    ########################################################

    - name: Configure Kernel
      run: ./build/05_configure_kernel.sh

    ########################################################
    # STEP 06
    ########################################################

    - name: Build Kernel
      run: ./build/06_build_kernel.sh

    ########################################################
    # STEP 07
    ########################################################

    - name: Package AnyKernel3
      run: ./build/07_package_anykernel.sh

    ########################################################
    # STEP 08
    ########################################################

    - name: Collect Debug
      if: always()
      run: ./build/08_collect_logs.sh

    ########################################################
    # Upload Debug
    ########################################################

    - name: Upload Debug
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Debug
        path: debug/

    ########################################################
    # Upload Build
    ########################################################

    - name: Upload Kernel ZIP
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel
        path: out/*.zip
